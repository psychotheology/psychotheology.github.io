<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psychotheology</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root { --bg: #f8f8ff; --ink: #2b2b2b; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      display: grid;
      grid-template-rows: 1fr auto 1fr;  /* top band | globe | bottom band */
      justify-items: center;             /* center everything horizontally */
}

    h1 {
      font-family: "Times New Roman", Times, serif;
      font-weight: bold;
      font-size: 2rem;
      color: var(--ink);
      align-self: center;                /* center vertically within the top band */
      margin: 0;                         /* no margin needed anymore */
  /* ...your font-family, font-weight, font-size, etc. */
}
    
    canvas {
      width: min(50vmin, 640px);
      height: min(50vmin, 640px);
    }
    
    canvas.plane {
  cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='-4 -4 32 32'><g transform='rotate(45 12 12)'><path d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z' fill='%232b2b2b' stroke='white' stroke-width='0'/></g></svg>") 16 16, auto;
}
    
  </style>
</head>
<body>
  <h1>PSYCHOTHEOLOGY</h1>
  <canvas id="globe"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script>
    const canvas = document.getElementById('globe');
    const ctx = canvas.getContext('2d');
    canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    canvas.classList.toggle('plane', Math.hypot(x, y) <= 0.47); // 470/1000 = globe radius
});
    canvas.addEventListener('mouseleave', () => canvas.classList.remove('plane'));
    const W = (canvas.width = 1000);
    const H = (canvas.height = 1000);

    const projection = d3.geoOrthographic()
      .scale(470)
      .translate([W / 2, H / 2])
      .clipAngle(90);
    const path = d3.geoPath(projection, ctx);
    const sphere = { type: 'Sphere' };
    const graticule = d3.geoGraticule10();

    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json').then(world => {
      const land = topojson.feature(world, world.objects.land);

      d3.timer(elapsed => {
        projection.rotate([elapsed * 0.01, -20]); // ~10 degrees per second
        ctx.clearRect(0, 0, W, H);

        ctx.beginPath(); path(sphere);
        ctx.fillStyle = '#f8f8ff'; ctx.fill();

        ctx.beginPath(); path(graticule);
        ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1; ctx.stroke();

        ctx.beginPath(); path(land);
        ctx.fillStyle = '#2b2b2b'; ctx.fill();

        ctx.beginPath(); path(sphere);
        ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2; ctx.stroke();
      });
    });
  </script>
</body>
</html>
